<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Stackly</title>
<meta name="description" content="Log in to your dashboard.">
<link rel="icon" type="image/png" href="assets/favicon.png?v=3">
<link rel="icon" type="image/webp" href="assets/favicon.webp?v=3">
<link rel="apple-touch-icon" href="assets/favicon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/pages.css">
<link rel="stylesheet" href="assets/theme.css?v=23">
<style>body{padding-top:0}.auth-wrap{min-height:100vh}</style>
</head>
<body>
<div id="preloader" aria-hidden="true">
  <div class="pl-inner"><svg class="pl-logo" viewBox="0 0 64 64" width="66" height="66" aria-hidden="true" focusable="false"><rect x="3" y="3" width="58" height="58" rx="19" fill="#1D6FE0"/><path d="M26 13h12v13h13v12H38v13H26V38H13V26h13z" fill="#fff"/><path d="M8 32h13l4-9 7 18 5-11h19" fill="none" stroke="#FF6F6F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="pl-bar"><span></span></div></div>
</div>

<div class="auth-wrap">
  <div class="auth-side">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/logo.webp?v=3" alt="Stackly" width="145" height="42">
    </a>
    <div>
      <div class="a-quote">"Twelve weeks in and our patient flow finally runs on time."</div>
      <div class="a-who">Jordan M. — Patient &amp; Appointment Care, Month 3</div>
    </div>
  </div>
  <div class="auth-form">
    <div class="auth-form-inner">
      <a class="back-home" href="index.html"><span aria-hidden="true">&larr;</span> Back to Home</a>
      <h1>Welcome back.</h1>
      <p class="lede">Log in to check your patients, log this week's visits, and message your care coordinator.</p>
      <div class="f-field">
        <label for="dashSelect">Sign in to</label>
        <select id="dashSelect">
          <option value="client">Patient Dashboard</option>
          <option value="manager">Care Coordinator Dashboard</option>
        </select>
      </div>
      <form data-login-form>
        <div class="f-field"><label>Email</label><input type="email" placeholder="you@email.com" required></div>
        <div class="f-field"><label>Password</label><input type="password" placeholder="••••••••" required></div>
        <div class="auth-check">
          <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" style="width:auto;"> Remember me</label>
          <a href="forgot-password.html" style="margin-left:auto; font-weight:800; color:var(--ember-deep);">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-solid" style="width:100%;">Log In</button>
      </form>
      <div class="auth-foot">New to Stackly? <a href="signup.html">Create an account</a></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="assets/site.js"></script>
<script>
/* The "Sign in to" selection decides which dashboard the login form sends you to */
(function(){
  var select = document.getElementById('dashSelect');
  var form = document.querySelector('[data-login-form]');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var btn = form.querySelector('button[type="submit"]');
    btn.textContent = 'Logging In…';
    btn.disabled = true;
    if(typeof gsap !== 'undefined'){
      gsap.to('.auth-form-inner', {opacity:0, y:-14, duration:0.35, ease:'power2.in', onComplete:goToDashboard});
    } else {
      setTimeout(goToDashboard, 300);
    }
    function goToDashboard(){
      try{ sessionStorage.setItem('stackly_role', select.value); sessionStorage.setItem('stackly_email', form.querySelector('input[type="email"]').value.trim()); sessionStorage.removeItem('stackly_name'); }catch(e){}
      window.location.href = select.value === 'manager' ? 'dashboard-manager.html' : 'dashboard-client.html';
    }
  });
})();
</script>
</body>
</html>
